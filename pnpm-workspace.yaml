autoDedupe: true

packages:
  - apps/*
  - packages/*
  - playgrounds

allowBuilds:
  '@prisma/engines': false
  cn-font-split: true
  core-js: false
  esbuild: true
  koffi: true
  msw: false
  prisma: false
  protobufjs: false
  sharp: false

patchedDependencies:
  '@monaco-editor/loader': patches/@monaco-editor__loader.patch
  '@shikijs/transformers': patches/@shikijs__transformers.patch

overrides:
  prosemirror-view: 1.42.3

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@aws-sdk/*'
  - '@next/*'
  - next
  - react
  - react-dom
  - varcel

catalogMode: prefer
cleanupUnusedCatalogs: true
